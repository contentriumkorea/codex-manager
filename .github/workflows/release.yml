name: Windows release

on:
  push:
    branches: [main]
    paths:
      - src/project_manager/version.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { throw 'Project installation failed' }
      - name: Install Codex integration-test runtime
        run: |
          $codexTestDir = Join-Path $env:RUNNER_TEMP 'codex-test-runtime'
          npm install --prefix "$codexTestDir" --no-audit --no-fund @openai/codex@0.160.0
          if ($LASTEXITCODE -ne 0) { throw 'Codex test runtime installation failed' }
          $codexNative = Get-ChildItem -LiteralPath "$codexTestDir/node_modules/@openai" -Filter codex.exe -Recurse | Select-Object -First 1
          if (-not $codexNative) { throw 'Native Codex test executable was not found' }
          & $codexNative.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'Codex test runtime did not start' }
          $codexNative.DirectoryName >> $env:GITHUB_PATH
          "CODEX_TEST_BINARY=$($codexNative.FullName)" >> $env:GITHUB_ENV
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/unit/test_updates.py tests/unit/test_release_packaging.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
      - name: Install verified Inno Setup compiler
        run: |
          $compilerSetup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $compilerSetup
          if ((Get-FileHash -LiteralPath $compilerSetup -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Compiler hash mismatch' }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'inno6'
          $p = Start-Process -FilePath $compilerSetup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$compilerDir`"") -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Compiler installation failed' }
          "ISCC=$compilerDir\ISCC.exe" >> $env:GITHUB_ENV
      - name: Prepare Rust and verified runtime
        run: |
          rustup default 1.99.1
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          rustup component add clippy --toolchain 1.99.1
          if ($LASTEXITCODE -ne 0) { throw 'Rust lint component installation failed' }
          $cab = Join-Path $env:GITHUB_WORKSPACE '.test-artifacts/webview2.cab'
          $runtimeRoot = Join-Path $env:GITHUB_WORKSPACE '.test-artifacts/webview2'
          New-Item -ItemType Directory -Path $runtimeRoot -Force | Out-Null
          Invoke-WebRequest 'https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/b7919cc9-680d-4253-bf32-732988e68aa6/Microsoft.WebView2.FixedVersionRuntime.156.0.4314.58.x64.cab' -OutFile $cab
          if ((Get-FileHash -LiteralPath $cab -Algorithm SHA256).Hash.ToLowerInvariant() -ne '857dcfd6f7035508a29645fa2978c3a6a841f220df77cc366d318894e19f4792') { throw 'Runtime checksum mismatch' }
          & expand.exe $cab '-F:*' $runtimeRoot
          if ($LASTEXITCODE -ne 0) { throw 'Runtime extraction failed' }
          $runtime = Join-Path $runtimeRoot 'Microsoft.WebView2.FixedVersionRuntime.156.0.4314.58.x64'
          ./tools/verify_microsoft_runtime.ps1 -Path "$runtime/msedgewebview2.exe"
          "FIXED_RUNTIME=$runtime" >> $env:GITHUB_ENV
          "FIXED_CAB=$cab" >> $env:GITHUB_ENV
      - name: Native core and frontend tests
        run: |
          cargo test --locked --manifest-path rust-core/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Rust core tests failed' }
          $env:CODEX_TEST_HOME = Join-Path $env:GITHUB_WORKSPACE '.test-artifacts/native-codex-integration'
          cargo test --locked --manifest-path rust-core/Cargo.toml --lib --test appserver_smoke --test management --test cross_store -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Native Codex integration tests failed' }
          cargo test --locked --manifest-path rust-desktop/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Rust desktop tests failed' }
          cargo clippy --locked --manifest-path rust-desktop/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Rust desktop lint failed' }
          node --test rust-desktop/tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed' }
      - name: Build application payload
        run: |
          $env:CARGO_ENCODED_RUSTFLAGS = @('-C','target-feature=+crt-static',('--remap-path-prefix='+$env:GITHUB_WORKSPACE+'=.'),('--remap-path-prefix='+$env:USERPROFILE+'=<build-user>')) -join [char]31
          python tools/build_rust_release.py --runtime "$env:FIXED_RUNTIME" --cab "$env:FIXED_CAB" --output releases/native
          if ($LASTEXITCODE -ne 0) { throw 'Native application build failed' }
      - name: Verify online install, failure recovery and in-app update
        run: |
          python tools/verify_bootstrap.py --compiler "$env:ISCC" --root .test-artifacts/bootstrap --release releases/native/app
          if ($LASTEXITCODE -ne 0) { throw 'Native installer verification failed' }
      - name: Verify old frozen launcher transition
        run: |
          $legacy = Join-Path $env:GITHUB_WORKSPACE '.test-artifacts/legacy0104'
          New-Item -ItemType Directory -Path $legacy -Force | Out-Null
          gh release download v0.10.4 --repo contentriumkorea/codex-manager --pattern Codex-Manager-Windows-x64.zip --dir "$legacy"
          if ($LASTEXITCODE -ne 0) { throw 'Published legacy payload download failed' }
          python tools/verify_legacy_transition.py --previous "$legacy/Codex-Manager-Windows-x64.zip" --release releases/native/app --root .test-artifacts/legacy-transition
          if ($LASTEXITCODE -ne 0) { throw 'Legacy launcher transition failed' }
      - name: Verify portable ZIP without installation
        run: |
          python -m pytest tests/ui/test_windows_shell.py tests/ui/test_job_progress.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows regression failed' }
          python tools/verify_portable.py --release releases/native/app --root .test-artifacts/portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable verification failed' }
      - name: Publish immutable installer and versioned application
        run: |
          python tools/publish_release.py --compiler "$env:ISCC" --release releases/native/app --commit "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed' }
