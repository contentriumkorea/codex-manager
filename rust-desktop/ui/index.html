<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Codex Manager</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="shell.css" />
    <script type="module" src="shell.mjs"></script>
  </head>
  <body>
    <div class="shell">
      <header class="shell-header">
        <div class="brand">
          <img src="app-icon.png" alt="" />
          <div>
            <strong>Codex Manager</strong
            ><small>폴더와 함께 보관하는 프로젝트·대화·파일</small>
          </div>
        </div>
        <nav aria-label="공통 작업">
          <button id="global-open-folder">▱ 폴더 열기</button>
          <button id="global-import">↙ 백업 가져오기</button
          ><button id="global-history">◷ 작업 내역·복구</button
          ><button id="global-settings">⚙ 설정</button
          ><button id="updates">↻ 업데이트 <span id="version"></span></button>
          <button id="split-toggle" aria-label="분할 화면 열기" aria-pressed="false" title="분할 화면 열기">◫</button>
        </nav>
      </header>
      <div class="shell-actions">
        <span id="active-label">메인 화면의 프로젝트·파일을 선택하세요</span
        ><button id="transfer-move">대상 폴더로 이동</button
        ><button id="transfer-copy">대상 폴더로 복사</button
        ><span id="shell-status" role="status" aria-live="polite"></span>
      </div>
      <div class="explorers-scroll">
        <div id="explorers" class="explorers">
          <section id="left-pane" class="pane active">
            <iframe id="left-frame" title="프로젝트·대화·파일 관리"></iframe>
          </section>
          <div
            id="splitter"
            hidden
            role="separator"
            tabindex="0"
            aria-label="탐색기 너비 조절"
            aria-orientation="vertical"
            aria-valuemin="25"
            aria-valuemax="75"
            aria-valuenow="50"
          ></div>
          <section id="right-pane" class="pane destination-pane" hidden aria-label="대상 폴더 탐색기">
            <h2>대상 폴더</h2>
            <div class="destination-actions"><button id="destination-pick">폴더 선택</button><button id="destination-up" disabled>↑ 상위</button></div>
            <div class="destination-address"><input id="destination-address" aria-label="대상 폴더 주소" placeholder="폴더 경로 입력"><button id="destination-go">이동</button></div>
            <input id="destination-search" type="search" aria-label="대상 하위 폴더 검색" placeholder="하위 폴더 검색">
            <p id="destination-current">대상 폴더를 선택하세요.</p>
            <small id="destination-hint">현재 폴더에 전송합니다.</small>
            <div id="destination-list" aria-label="하위 폴더 목록"></div>
            <div class="destination-actions"><button id="destination-copy">선택 항목 복사</button><button id="destination-move">선택 항목 이동</button></div>
          </section>
        </div>
      </div>
      <section
        id="progress"
        class="progress-panel"
        hidden
        aria-label="작업 진행 상황"
      >
        <div class="progress-top">
          <strong id="progress-phase">작업 준비</strong
          ><span id="progress-percent"></span><button id="cancel">취소</button>
        </div>
        <progress id="progress-bar" max="100"></progress>
        <div id="progress-path" class="progress-path"></div>
        <div id="progress-stats"></div>
      </section>
      <div id="update-banner" hidden>
        <span id="update-text"></span><button id="update-now">업데이트</button>
      </div>
    </div>
    <dialog id="dialog">
      <form id="dialog-form">
        <div class="dialog-heading">
          <h2 id="dialog-title"></h2>
          <button id="dialog-close" type="button" aria-label="닫기">×</button>
        </div>
        <div id="dialog-content"></div>
        <div id="dialog-error" role="alert" hidden></div>
        <div class="dialog-buttons">
          <button id="dialog-cancel" type="button">취소</button
          ><button id="dialog-ok" type="submit" class="primary">확인</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
