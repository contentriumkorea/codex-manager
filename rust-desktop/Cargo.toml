[package]
name = "codex-manager"
version = "0.13.0"
edition = "2021"
publish = false
build = "build.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"
codex-manager-core = { path = "../rust-core" }
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
