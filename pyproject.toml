[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-manager"
version = "0.6.0"
requires-python = ">=3.10"
dependencies = ["PySide6", "tomli>=2; python_version < '3.11'"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project_manager = ["ui/*.qss", "ui/*.png", "ui/*.ico", "ui/*.svg", "install_update.ps1"]
